*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{
background:linear-gradient(
135deg,
#000000,

#b8860b,
#ffd700
);
min-height:100vh;
color:#fff;
}
.page{display:none;min-height:100vh;justify-content:center;align-items:center;padding:20px}
.active{display:flex}
.card{
width:100%;
max-width:420px;
padding:30px;
border-radius:30px;

input{

input:focus{

}

.btn{
width:100%;
padding:15px;
border:none;
border-radius:15px;
font-size:16px;
font-weight:bold;

margin-top:12px;

}

.primary{
background:linear-gradient(
135deg,
#ffd700,
#ffb300
);
color:#000;
}

.success{
background:linear-gradient(
135deg,
#fff3b0,
#ffd700
);
color:#000;
}

.btn:hover{
transform:translateY(-3px);
box-shadow:0 10px 20px rgba(0,0,0,.25);
}

@keyframes fadeUp{
from{
opacity:0;
transform:translateY(30px);
}
to{
opacity:1;
transform:translateY(0);
}
}

@keyframes float{
0%,100%{
transform:translateY(0);
}
50%{
transform:translateY(-8px);
}
}

/* ===== APP ANIMATIONS ===== */
.anim-overlay{
  position:fixed; inset:0; z-index:9999; display:none;
  align-items:center; justify-content:center;
  background:rgba(0,0,0,.72); backdrop-filter:blur(8px);
}
.anim-overlay.show{display:flex; animation:overlayIn .25s ease both}
.anim-box{text-align:center; padding:30px; min-width:230px}
.anim-ring{
  width:92px;height:92px;border-radius:50%;margin:auto;
  border:5px solid rgba(255,215,0,.25);
  border-top-color:#ffd700;
  animation:spin .75s linear infinite;
}
.anim-check{
  width:100px;height:100px;border-radius:50%;margin:auto;
  background:#ffd700;color:#000;font-size:62px;font-weight:bold;
  display:flex;align-items:center;justify-content:center;
  animation:checkPop .65s cubic-bezier(.2,.9,.2,1) both;
  box-shadow:0 0 35px rgba(255,215,0,.7);
}
.anim-title{margin-top:18px;font-size:22px;font-weight:bold;animation:textUp .5s .15s ease both}
.anim-sub{margin-top:8px;opacity:.85;animation:textUp .5s .25s ease both}

.app-animate{animation:screenIn .55s cubic-bezier(.2,.8,.2,1) both}
.shake-now{animation:shakeNow .45s ease both!important}
.pulse-now{animation:pulseNow .55s ease both!important}

@keyframes overlayIn{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes checkPop{
  0%{opacity:0;transform:scale(.15) rotate(-25deg)}
  65%{opacity:1;transform:scale(1.15) rotate(5deg)}
  100%{opacity:1;transform:scale(1) rotate(0)}
}
@keyframes textUp{
  from{opacity:0;transform:translateY(18px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes screenIn{
  from{opacity:0;transform:translateY(28px) scale(.96)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
@keyframes shakeNow{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-11px)}
  40%{transform:translateX(11px)}
  60%{transform:translateX(-7px)}
  80%{transform:translateX(7px)}
}
@keyframes pulseNow{
  0%{transform:scale(1)}
  50%{transform:scale(1.08)}
  100%{transform:scale(1)}
}
